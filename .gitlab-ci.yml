image: registry.znuny.com/znuny/docker-otrs5ci:latest

stages:
  - test

mysql:
  stage: test
  services:
    - name: registry.znuny.com/znuny/docker-mysql-utf8:latest
      alias: mysql
  script:
    - env
    - pwd
    - /run.sh
    - su -c "perl /opt/otrs/bin/otrs.Console.pl Znuny4OTRS::AdvancedPackageManager::InstallSOPM /opt/otrs/Znuny4OTRS-DashboardWidgetSearchProfile.sopm" -s /bin/bash otrs
    - su -c "perl /opt/otrs/bin/otrs.Console.pl Dev::UnitTest::Run --verbose --test Znuny4OTRSDashboardWidgetSearchProfile/SearchProfile" -s /bin/bash otrs
